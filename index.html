<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACK-OUT WARS 242 - Brazzaville Urbain Complet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #05070e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    
    #ui-hud {
      position: absolute; top: 20px; left: 20px; color: #fff; font-family: monospace; font-size: 13px;
      background: rgba(10, 15, 25, 0.9); padding: 14px 20px; border-radius: 10px;
      border: 1px solid rgba(255,153,0,0.6); z-index: 100; pointer-events: none; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    #ui-hud h1 { font-size: 16px; color: #ff9900; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }

    #anger-bar-container { width: 100%; height: 10px; background: #222; border-radius: 5px; margin-top: 8px; overflow: hidden; border: 1px solid #444; }
    #anger-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #ffcc00, #ff2200); transition: width 0.3s; }

    #radar-container {
      position: absolute; top: 20px; right: 20px; width: 135px; height: 135px;
      background: rgba(8, 12, 20, 0.9); border: 2px solid #ff9900; border-radius: 50%;
      z-index: 100; overflow: hidden; box-shadow: 0 0 15px rgba(255, 153, 0, 0.3);
    }
    #radar-canvas { width: 100%; height: 100%; }

    #ps-controls { position: fixed; bottom: 25px; right: 25px; width: 150px; height: 150px; z-index: 999; touch-action: none; }
    .ps-btn {
      position: absolute; width: 48px; height: 48px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4); background: rgba(0,0,0,0.7);
      color: white; font-weight: bold; font-size: 18px; display: flex;
      align-items: center; justify-content: center; cursor: pointer; user-select: none;
    }
    .ps-btn:active { transform: scale(0.9); }
    #btn-triangle { top: 0; left: 51px; border-color: #00ffaa; color: #00ffaa; }
    #btn-square { top: 51px; left: 0; border-color: #ff55aa; color: #ff55aa; }
    #btn-circle { top: 51px; right: 0; border-color: #ff3333; color: #ff3333; }
    #btn-cross { bottom: 0; left: 51px; border-color: #3399ff; color: #3399ff; }

    #dialog-box {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(15, 20, 30, 0.96); border: 2px solid #ff9900; padding: 22px;
      border-radius: 14px; width: 330px; color: white; z-index: 20000; display: none;
    }
    .dialog-btns button { padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-bribe { background: #00aa55; color: white; }
    .btn-cut { background: #ff2200; color: white; margin-top: 10px; width: 100%; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-hud">
    <h1>BLACK-OUT WARS 242</h1>
    <p style="color: #ffcc00; font-weight: bold;">Zone : <span id="level-name">Bacongo</span></p>
    <p>Poteaux sabotés : <span id="sabotage-count">0</span>/5</p>
    <p>FCFA : <span id="money-count">0</span> FCFA</p>
    <p>Statut : <span id="stealth-status" style="color: #00ffaa;">Visible</span></p>
    <div id="anger-bar-container"><div id="anger-bar"></div></div>
  </div>

  <div id="radar-container"><canvas id="radar-canvas" width="135" height="135"></canvas></div>

  <div id="ps-controls">
    <div class="ps-btn" id="btn-triangle">🔺</div>
    <div class="ps-btn" id="btn-square">🔲</div>
    <div class="ps-btn" id="btn-circle">⭕</div>
    <div class="ps-btn" id="btn-cross">❌</div>
  </div>

  <div id="dialog-box">
    <h3>CONTRÔLE SNE</h3>
    <p>Habitant : « Grand frère, pardon ne coupe pas le courant ! Prends 5000 FCFA... »</p>
    <div class="dialog-btns">
      <button class="btn-bribe" onclick="resolveBill(false)">🤝 Accepter l'argent</button>
      <button class="btn-cut" onclick="resolveBill(true)">😈 Couper quand même !</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050710);
    scene.fog = new THREE.FogExp2(0x050710, 0.007);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x223355, 0.7));
    const moon = new THREE.DirectionalLight(0x7799bb, 0.5);
    moon.position.set(40, 80, 20);
    scene.add(moon);

    const collisionBoxes = [];
    const movingTaxis = [];
    const pedestrians = [];

    // --- FLEUVE CONGO ---
    const river = new THREE.Mesh(
      new THREE.PlaneGeometry(600, 150),
      new THREE.MeshStandardMaterial({ color: 0x001133, roughness: 0.1, metalness: 0.8 })
    );
    river.rotation.x = -Math.PI / 2;
    river.position.set(0, -0.5, -130);
    scene.add(river);

    // --- MATÉRIAUX URBAINS ---
    const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x1a1c23, roughness: 0.95 });
    const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x4a4d58, roughness: 0.8 });
    const whiteLineMat = new THREE.MeshBasicMaterial({ color: 0xeeeeee });
    const wallColors = [0xc47e5a, 0x8c7a6b, 0xd4a373, 0x587b7f, 0x9b59b6];

    // --- MONUMENTS (Tour Nabemba) ---
    function createTourNabemba(x, z) {
      const group = new THREE.Group();
      const glassMat = new THREE.MeshStandardMaterial({ color: 0x446688, metalness: 0.9, roughness: 0.1 });
      for (let i = 0; i < 2; i++) {
        const offset = (i === 0) ? -6 : 6;
        const tower = new THREE.Mesh(new THREE.CylinderGeometry(5, 5.5, 45, 24), glassMat);
        tower.position.set(offset, 22.5, 0);
        group.add(tower);
      }
      const bridge = new THREE.Mesh(new THREE.BoxGeometry(8, 25, 6), glassMat);
      bridge.position.set(0, 25, 0); group.add(bridge);
      group.position.set(x, 0, z); scene.add(group);
      collisionBoxes.push({ minX: x - 12, maxX: x + 12, minZ: z - 8, maxZ: z + 8 });
    }
    createTourNabemba(-60, -50);

    // --- TAXIS VERTS ET BLANCS ---
    function createTaxi(x, z, rotY) {
      const taxiGroup = new THREE.Group();
      const greenMat = new THREE.MeshStandardMaterial({ color: 0x118833, roughness: 0.3 });
      const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
      
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.8, 3.8), greenMat);
      body.position.y = 0.5; taxiGroup.add(body);
      const roof = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.6, 2.2), whiteMat);
      roof.position.set(0, 1.1, -0.1); taxiGroup.add(roof);

      // Phares allumés
      const headlight = new THREE.SpotLight(0xffffaa, 3, 15, 0.4);
      headlight.position.set(0, 0.6, 1.9);
      headlight.target.position.set(0, 0, 10);
      taxiGroup.add(headlight); taxiGroup.add(headlight.target);

      taxiGroup.position.set(x, 0, z);
      taxiGroup.rotation.y = rotY || 0;
      scene.add(taxiGroup);
      return taxiGroup;
    }

    // --- LAMPADAIRES ---
    function createStreetLight(x, z, group) {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 5), new THREE.MeshStandardMaterial({ color: 0x222222 }));
      pole.position.set(x, 2.5, z);
      group.add(pole);

      const lamp = new THREE.PointLight(0xffaa33, 3.5, 16);
      lamp.position.set(x, 4.8, z);
      group.add(lamp);
    }

    // --- MONDE OUVERT ALIGNÉ PAR GRILLE (AVENUES & RUELLES) ---
    const CHUNK_SIZE = 60;
    const worldChunks = new Map();

    function spawnChunkContent(cx, cz) {
      const key = `${cx},${cz}`;
      if (worldChunks.has(key)) return;

      const chunkGroup = new THREE.Group();
      const startX = cx * CHUNK_SIZE;
      const startZ = cz * CHUNK_SIZE;

      // 1. GOUDRON (Avenue principale au centre & Ruelles perpendiculaires)
      const roadGeo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE);
      const ground = new THREE.Mesh(roadGeo, asphaltMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.set(startX + CHUNK_SIZE/2, 0, startZ + CHUNK_SIZE/2);
      chunkGroup.add(ground);

      if (cz > -2) {
        // 2. TROTTOIRS ET MARQUAGES AU SOL
        // Avenue principale (Axe X)
        const mainRoadStrip = new THREE.Mesh(new THREE.PlaneGeometry(CHUNK_SIZE, 14), asphaltMat);
        mainRoadStrip.rotation.x = -Math.PI / 2;
        mainRoadStrip.position.set(startX + CHUNK_SIZE/2, 0.01, startZ + CHUNK_SIZE/2);
        chunkGroup.add(mainRoadStrip);

        // Ligne blanche discontinue au milieu de l'avenue
        for (let l = 0; l < CHUNK_SIZE; l += 8) {
          const dash = new THREE.Mesh(new THREE.PlaneGeometry(4, 0.4), whiteLineMat);
          dash.rotation.x = -Math.PI / 2;
          dash.position.set(startX + l + 2, 0.02, startZ + CHUNK_SIZE/2);
          chunkGroup.add(dash);
        }

        // Trottoirs sur les côtés de l'avenue
        const sidewalkNorth = new THREE.Mesh(new THREE.BoxGeometry(CHUNK_SIZE, 0.3, 3), sidewalkMat);
        sidewalkNorth.position.set(startX + CHUNK_SIZE/2, 0.15, startZ + CHUNK_SIZE/2 - 8.5);
        chunkGroup.add(sidewalkNorth);

        const sidewalkSouth = new THREE.Mesh(new THREE.BoxGeometry(CHUNK_SIZE, 0.3, 3), sidewalkMat);
        sidewalkSouth.position.set(startX + CHUNK_SIZE/2, 0.15, startZ + CHUNK_SIZE/2 + 8.5);
        chunkGroup.add(sidewalkSouth);

        // Lampadaires le long des trottoirs
        createStreetLight(startX + 10, startZ + CHUNK_SIZE/2 - 8.5, chunkGroup);
        createStreetLight(startX + 40, startZ + CHUNK_SIZE/2 - 8.5, chunkGroup);
        createStreetLight(startX + 25, startZ + CHUNK_SIZE/2 + 8.5, chunkGroup);

        // 3. MAISONS ET IMMEUBLES PARFAITEMENT ALIGNÉS LE LONG DES RUELLES
        // Pâté de maisons NORD
        for (let i = 0; i < 3; i++) {
          const bx = startX + 8 + i * 18;
          const bz = startZ + CHUNK_SIZE/2 - 18;
          const isBuilding = (i === 1); // Un immeuble R+2 au milieu

          const height = isBuilding ? 12 : 5;
          const depth = 8;
          const width = 12;

          const buildingMat = new THREE.MeshStandardMaterial({ color: wallColors[i % wallColors.length] });
          const building = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), buildingMat);
          building.position.set(bx, height / 2, bz);
          chunkGroup.add(building);

          // Toit en tôle pour les maisons
          if (!isBuilding) {
            const roof = new THREE.Mesh(new THREE.ConeGeometry(9, 2.5, 4), new THREE.MeshStandardMaterial({ color: 0x666666 }));
            roof.position.set(bx, height + 1.25, bz);
            roof.rotation.y = Math.PI / 4;
            chunkGroup.add(roof);
          }

          collisionBoxes.push({ minX: bx - width/2 - 0.5, maxX: bx + width/2 + 0.5, minZ: bz - depth/2 - 0.5, maxZ: bz + depth/2 + 0.5 });
        }

        // Pâté de maisons SUD
        for (let i = 0; i < 3; i++) {
          const bx = startX + 8 + i * 18;
          const bz = startZ + CHUNK_SIZE/2 + 18;

          const buildingMat = new THREE.MeshStandardMaterial({ color: wallColors[(i + 2) % wallColors.length] });
          const building = new THREE.Mesh(new THREE.BoxGeometry(12, 5, 8), buildingMat);
          building.position.set(bx, 2.5, bz);
          chunkGroup.add(building);

          collisionBoxes.push({ minX: bx - 6.5, maxX: bx + 6.5, minZ: bz - 4.5, maxZ: bz + 4.5 });
        }

        // 4. TAXI EN CIRCULATION SUR L'AVENUE
        const taxi = createTaxi(startX + 10, startZ + CHUNK_SIZE/2 + 3, Math.PI / 2);
        movingTaxis.push({ mesh: taxi, speed: 0.12, startX: startX, endX: startX + CHUNK_SIZE });
      }

      scene.add(chunkGroup);
      worldChunks.set(key, chunkGroup);
    }

    function updateOpenWorld(playerX, playerZ) {
      const currentCx = Math.floor(playerX / CHUNK_SIZE);
      const currentCz = Math.floor(playerZ / CHUNK_SIZE);
      for (let x = -1; x <= 1; x++) {
        for (let z = -1; z <= 1; z++) spawnChunkContent(currentCx + x, currentCz + z);
      }
    }

    function checkCollision(nextX, nextZ) {
      for (let box of collisionBoxes) {
        if (nextX >= box.minX && nextX <= box.maxX && nextZ >= box.minZ && nextZ <= box.maxZ) return true;
      }
      return false;
    }

    // --- ADOUKUS ---
    const adoukusGroup = new THREE.Group();
    const blueUniformMat = new THREE.MeshStandardMaterial({ color: 0x1040b0 });
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.4), blueUniformMat); torso.position.y = 1.15; adoukusGroup.add(torso);
    const vest = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.4, 0.42), new THREE.MeshStandardMaterial({ color: 0xff6600 })); vest.position.y = 1.25; adoukusGroup.add(vest);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: 0x5c3a21 })); head.position.y = 1.8; adoukusGroup.add(head);
    const helmet = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.2, 0.48), new THREE.MeshStandardMaterial({ color: 0xffcc00 })); helmet.position.y = 2.02; adoukusGroup.add(helmet);

    const legGeo = new THREE.BoxGeometry(0.28, 0.7, 0.28);
    const leftLeg = new THREE.Mesh(legGeo, blueUniformMat); leftLeg.position.set(-0.2, 0.35, 0); adoukusGroup.add(leftLeg);
    const rightLeg = new THREE.Mesh(legGeo, blueUniformMat); rightLeg.position.set(0.2, 0.35, 0); adoukusGroup.add(rightLeg);
    const armGeo = new THREE.BoxGeometry(0.22, 0.65, 0.22);
    const leftArm = new THREE.Mesh(armGeo, blueUniformMat); leftArm.position.set(-0.48, 1.15, 0); adoukusGroup.add(leftArm);
    const rightArm = new THREE.Mesh(armGeo, blueUniformMat); rightArm.position.set(0.48, 1.15, 0); adoukusGroup.add(rightArm);
    adoukusGroup.position.set(10, 0, 30);
    scene.add(adoukusGroup);

    // --- POTEAUX SNE ---
    let poles = [], sabotagedCount = 0, moneyCount = 0, moveSpeed = 0.16, gameOver = false;
    let nearbyPole = null, currentBuilding = null;

    function setupPoles() {
      poles.forEach(p => scene.remove(p.group));
      poles = [];
      const polePositions = [{ x: 15, z: 21 }, { x: 45, z: 21 }, { x: 25, z: 39 }, { x: -15, z: 21 }, { x: -35, z: 39 }];
      polePositions.forEach((pos) => {
        const poleGroup = new THREE.Group();
        const poleMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 7), new THREE.MeshStandardMaterial({ color: 0x333333 }));
        poleMesh.position.y = 3.5; poleGroup.add(poleMesh);
        const light = new THREE.PointLight(0xffbb44, 4.0, 25);
        light.position.set(0, 6.5, 0); poleGroup.add(light);
        poleGroup.position.set(pos.x, 0, pos.z);
        scene.add(poleGroup);
        poles.push({ group: poleGroup, light: light, active: true, position: new THREE.Vector3(pos.x, 0, pos.z) });
      });
    }
    setupPoles();

    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.key] = true; });
    window.addEventListener('keyup', (e) => keys[e.key] = false);

    document.getElementById('btn-circle').addEventListener('click', () => {
      if (nearbyPole && !gameOver) { currentBuilding = nearbyPole; document.getElementById('dialog-box').style.display = 'block'; }
    });

    window.resolveBill = function(cut) {
      document.getElementById('dialog-box').style.display = 'none';
      if (!currentBuilding) return;
      moneyCount += 5000;
      document.getElementById('money-count').innerText = moneyCount;
      if (cut) {
        currentBuilding.active = false; currentBuilding.light.intensity = 0;
        sabotagedCount++;
        document.getElementById('sabotage-count').innerText = sabotagedCount;
      }
    };

    // --- BOUCLE PRINCIPALE ---
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      if (gameOver) return;

      const time = clock.getElapsedTime();

      // Déplacement continu des Taxis sur les grandes avenues
      movingTaxis.forEach(t => {
        t.mesh.position.x += t.speed;
        if (t.mesh.position.x > t.endX) t.mesh.position.x = t.startX;
      });

      // Déplacement d'Adoukus
      let moveX = 0, moveZ = 0;
      if (keys.z || keys.Z || keys.ArrowUp) moveZ -= 1;
      if (keys.s || keys.S || keys.ArrowDown) moveZ += 1;
      if (keys.q || keys.Q || keys.ArrowLeft) moveX -= 1;
      if (keys.d || keys.D || keys.ArrowRight) moveX += 1;

      if (moveX !== 0 || moveZ !== 0) {
        const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
        const nextX = adoukusGroup.position.x + (moveX / len) * moveSpeed;
        const nextZ = adoukusGroup.position.z + (moveZ / len) * moveSpeed;

        if (!checkCollision(nextX, nextZ)) {
          adoukusGroup.position.x = nextX;
          adoukusGroup.position.z = nextZ;
        }
        adoukusGroup.rotation.y = Math.atan2(moveX, moveZ);

        leftLeg.rotation.x = Math.sin(time * 12) * 0.6; rightLeg.rotation.x = -Math.sin(time * 12) * 0.6;
        leftArm.rotation.x = -Math.sin(time * 12) * 0.6; rightArm.rotation.x = Math.sin(time * 12) * 0.6;
      }

      updateOpenWorld(adoukusGroup.position.x, adoukusGroup.position.z);

      nearbyPole = null;
      poles.forEach(pole => { if (pole.active && adoukusGroup.position.distanceTo(pole.position) < 3.5) nearbyPole = pole; });

      camera.position.x = adoukusGroup.position.x;
      camera.position.z = adoukusGroup.position.z + 14;
      camera.position.y = adoukusGroup.position.y + 8;
      camera.lookAt(adoukusGroup.position.x, adoukusGroup.position.y + 1, adoukusGroup.position.z);

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

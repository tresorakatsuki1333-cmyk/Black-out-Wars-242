<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLACK-OUT WARS 242 - Quartier Équilibré</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        touch-action: none;
      }
      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #2b2218;
        font-family: sans-serif;
        user-select: none;
      }
      #canvas-container {
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
      }

      #ui-hud {
        position: absolute;
        top: 15px;
        left: 15px;
        color: #fff;
        font-family: monospace;
        font-size: 13px;
        background: rgba(20, 15, 10, 0.85);
        padding: 12px 18px;
        border-radius: 8px;
        border: 1px solid rgba(255, 165, 0, 0.6);
        z-index: 100;
        pointer-events: none;
      }
      #ui-hud h1 {
        font-size: 15px;
        color: #ffaa00;
        margin-bottom: 4px;
        text-transform: uppercase;
      }

      #dpad-container {
        position: fixed;
        bottom: 30px;
        left: 30px;
        width: 140px;
        height: 140px;
        z-index: 999;
      }
      .d-btn {
        position: absolute;
        width: 44px;
        height: 44px;
        background: rgba(0, 0, 0, 0.5);
        border: 2px solid rgba(255, 255, 255, 0.6);
        border-radius: 8px;
        color: white;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        cursor: pointer;
      }
      .d-btn:active {
        background: rgba(255, 170, 0, 0.8);
      }
      #btn-up {
        top: 0;
        left: 48px;
      }
      #btn-down {
        bottom: 0;
        left: 48px;
      }
      #btn-left {
        top: 48px;
        left: 0;
      }
      #btn-right {
        top: 48px;
        right: 0;
      }

      #action-container {
        position: fixed;
        bottom: 30px;
        right: 30px;
        display: flex;
        gap: 15px;
        align-items: flex-end;
        z-index: 999;
      }
      .act-btn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        color: white;
        font-weight: bold;
        font-size: 11px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        text-transform: uppercase;
      }
      .act-btn:active {
        transform: scale(0.92);
      }
      #btn-run {
        background: rgba(0, 150, 255, 0.7);
        border: 2px solid #00aaff;
      }
      #btn-jump {
        background: rgba(40, 180, 40, 0.7);
        border: 2px solid #00ff66;
      }
      #btn-sabotage {
        background: rgba(220, 50, 50, 0.85);
        border: 2px solid #ff4444;
        width: 75px;
        height: 75px;
        font-size: 12px;
      }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  </head>
  <body>
    <div id="ui-hud">
      <h1>BLACK-OUT WARS 242</h1>
      <p>Quartier : <span id="level-name">Bacongo (Avenue Animée)</span></p>
      <p>
        Action : <span id="action-status" style="color: #00ffaa">Libre</span>
      </p>
    </div>

    <div id="dpad-container">
      <div class="d-btn" id="btn-up">▲</div>
      <div class="d-btn" id="btn-down">▼</div>
      <div class="d-btn" id="btn-left">◄</div>
      <div class="d-btn" id="btn-right">►</div>
    </div>

    <div id="action-container">
      <div class="act-btn" id="btn-run">Courir</div>
      <div class="act-btn" id="btn-jump">Sauter</div>
      <div class="act-btn" id="btn-sabotage">⚡ Couper</div>
    </div>

    <div id="canvas-container"></div>

    <script>
      const container = document.getElementById("canvas-container");
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xd4a373);
      scene.fog = new THREE.FogExp2(0xd4a373, 0.003);

      const camera = new THREE.PerspectiveCamera(
        55,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffeedd, 1.2));
      const sun = new THREE.DirectionalLight(0xfffaed, 1.0);
      sun.position.set(50, 100, 50);
      sun.castShadow = true;
      scene.add(sun);

      // TERRAIN & ROUTE
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(600, 600),
        new THREE.MeshStandardMaterial({ color: 0x4a3525, roughness: 0.95 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const mainRoad = new THREE.Mesh(
        new THREE.PlaneGeometry(16, 600),
        new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.8 })
      );
      mainRoad.rotation.x = -Math.PI / 2;
      mainRoad.position.y = 0.01;
      mainRoad.receiveShadow = true;
      scene.add(mainRoad);

      // Lignes jaunes de l'avenue
      for (let z = -280; z <= 280; z += 14) {
        const line = new THREE.Mesh(
          new THREE.PlaneGeometry(0.4, 7),
          new THREE.MeshBasicMaterial({ color: 0xffcc00 })
        );
        line.rotation.x = -Math.PI / 2;
        line.position.set(0, 0.02, z);
        scene.add(line);
      }

      const gltfLoader = new THREE.GLTFLoader();

      function tryLoadGLTF(paths, onSuccess) {
        if (!paths || paths.length === 0) return;
        const path = paths.shift();
        gltfLoader.load(
          path,
          (gltf) => {
            onSuccess(gltf);
          },
          undefined,
          () => {
            tryLoadGLTF(paths, onSuccess);
          }
        );
      }

      function setupShadows(model) {
        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
      }

      // 1. VRIS IMMEUBLES (Taille agrandie à 1.8)
      tryLoadGLTF(
        ["src/Big Building.glb", "src/BigBuilding.glb", "src/building.glb"],
        (gltf) => {
          const baseBuilding = gltf.scene;

          let index = 0;
          for (let z = -240; z <= 240; z += 45) {
            const scaleH = 1.6 + (index % 3) * 0.4;
            const scaleW = 1.6 + ((index * 7) % 3) * 0.3;

            // Côté Gauche
            const bLeft = baseBuilding.clone();
            bLeft.scale.set(scaleW, scaleH, scaleW);
            bLeft.position.set(-28, 0, z);
            bLeft.rotation.y = Math.PI / 2;
            setupShadows(bLeft);
            scene.add(bLeft);

            // Côté Droit
            const bRight = baseBuilding.clone();
            bRight.scale.set(scaleW, scaleH, scaleW);
            bRight.position.set(28, 0, z + 20);
            bRight.rotation.y = -Math.PI / 2;
            setupShadows(bRight);
            scene.add(bRight);

            index++;
          }
        }
      );

      // 2. ARBRES TAILLE NORMALE (Échelle ultra-réduite à 0.003)
      tryLoadGLTF(["src/Tree.glb", "src/tree.glb"], (gltf) => {
        const baseTree = gltf.scene;
        for (let z = -220; z <= 220; z += 40) {
          const t1 = baseTree.clone();
          t1.scale.set(0.003, 0.003, 0.003); // Échelle corrigée
          t1.position.set(-14, 0, z);
          setupShadows(t1);
          scene.add(t1);

          const t2 = baseTree.clone();
          t2.scale.set(0.003, 0.003, 0.003);
          t2.position.set(14, 0, z + 20);
          setupShadows(t2);
          scene.add(t2);
        }
      });

      // 3. ARRÊT DE BUS ET VOITURE (Ajustés à la bonne échelle)
      tryLoadGLTF(["src/busstop.glb", "src/Bus stop sign.glb"], (gltf) => {
        const model = gltf.scene;
        model.scale.set(0.003, 0.003, 0.003);
        model.position.set(-10, 0, -10);
        model.rotation.y = Math.PI / 2;
        setupShadows(model);
        scene.add(model);
      });

      tryLoadGLTF(["src/car.glb", "src/Sports Car.glb"], (gltf) => {
        const model = gltf.scene;
        model.scale.set(0.003, 0.003, 0.003);
        model.position.set(10, 0, 20);
        model.rotation.y = 0.1;
        setupShadows(model);
        scene.add(model);
      });

      // 4. CHARGEMENT ADOUKUS
      let adoukusModel = null;
      let mixer = null;
      let walkAction = null;
      const clock = new THREE.Clock();

      const fbxLoader = new THREE.FBXLoader();
      fbxLoader.load("src/adoukus.fbx", (object) => {
        adoukusModel = object;
        adoukusModel.scale.set(0.01, 0.01, 0.01);
        adoukusModel.position.set(0, 0, 10);
        setupShadows(adoukusModel);
        scene.add(adoukusModel);

        if (object.animations && object.animations.length > 0) {
          mixer = new THREE.AnimationMixer(adoukusModel);
          walkAction = mixer.clipAction(object.animations[0]);
          walkAction.play();
          walkAction.paused = true;
        }
      });

      // CONTROLES ET ANIMAION
      let isRunning = false;
      let isJumping = false;
      let verticalVelocity = 0;
      const gravity = -0.015;
      const moveInput = { up: false, down: false, left: false, right: false };

      function bindBtn(id, keyProp) {
        const el = document.getElementById(id);
        if (!el) return;
        const start = (e) => {
          e.preventDefault();
          moveInput[keyProp] = true;
        };
        const end = (e) => {
          e.preventDefault();
          moveInput[keyProp] = false;
        };
        el.addEventListener("touchstart", start);
        el.addEventListener("touchend", end);
        el.addEventListener("mousedown", start);
        el.addEventListener("mouseup", end);
      }

      bindBtn("btn-up", "up");
      bindBtn("btn-down", "down");
      bindBtn("btn-left", "left");
      bindBtn("btn-right", "right");

      window.addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (k === "z" || k === "arrowup") moveInput.up = true;
        if (k === "s" || k === "arrowdown") moveInput.down = true;
        if (k === "q" || k === "arrowleft") moveInput.left = true;
        if (k === "d" || k === "arrowright") moveInput.right = true;
        if (k === "shift") isRunning = true;
        if (k === " " && !isJumping) triggerJump();
        if (k === "e") triggerSabotage();
      });

      window.addEventListener("keyup", (e) => {
        const k = e.key.toLowerCase();
        if (k === "z" || k === "arrowup") moveInput.up = false;
        if (k === "s" || k === "arrowdown") moveInput.down = false;
        if (k === "q" || k === "arrowleft") moveInput.left = false;
        if (k === "d" || k === "arrowright") moveInput.right = false;
        if (k === "shift") isRunning = false;
      });

      const btnRun = document.getElementById("btn-run");
      btnRun.addEventListener("touchstart", (e) => {
        e.preventDefault();
        isRunning = !isRunning;
      });
      btnRun.addEventListener("click", () => {
        isRunning = !isRunning;
      });

      document
        .getElementById("btn-jump")
        .addEventListener("touchstart", (e) => {
          e.preventDefault();
          triggerJump();
        });
      document
        .getElementById("btn-jump")
        .addEventListener("click", triggerJump);

      document
        .getElementById("btn-sabotage")
        .addEventListener("touchstart", (e) => {
          e.preventDefault();
          triggerSabotage();
        });
      document
        .getElementById("btn-sabotage")
        .addEventListener("click", triggerSabotage);

      function triggerJump() {
        if (!isJumping && adoukusModel) {
          isJumping = true;
          verticalVelocity = 0.35;
        }
      }

      function triggerSabotage() {
        const statusEl = document.getElementById("action-status");
        statusEl.innerText = "⚡ Coupure en cours !";
        statusEl.style.color = "#ff4444";
        setTimeout(() => {
          statusEl.innerText = "Libre";
          statusEl.style.color = "#00ffaa";
        }, 1500);
      }

      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();

        if (adoukusModel) {
          let moveX = 0,
            moveZ = 0;
          if (moveInput.up) moveZ -= 1;
          if (moveInput.down) moveZ += 1;
          if (moveInput.left) moveX -= 1;
          if (moveInput.right) moveX += 1;

          const isMoving = moveX !== 0 || moveZ !== 0;

          if (walkAction) {
            walkAction.paused = !isMoving;
            walkAction.timeScale = isRunning ? 1.8 : 1.0;
          }
          if (mixer) mixer.update(delta);

          const baseSpeed = isRunning ? 0.28 : 0.14;

          if (isMoving) {
            const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
            adoukusModel.position.x += (moveX / len) * baseSpeed;
            adoukusModel.position.z += (moveZ / len) * baseSpeed;
            adoukusModel.rotation.y = Math.atan2(moveX, moveZ);
          }

          if (isJumping) {
            adoukusModel.position.y += verticalVelocity;
            verticalVelocity += gravity;
            if (adoukusModel.position.y <= 0) {
              adoukusModel.position.y = 0;
              isJumping = false;
            }
          }

          camera.position.x = adoukusModel.position.x;
          camera.position.z = adoukusModel.position.z + 10;
          camera.position.y = adoukusModel.position.y + 4.5;
          camera.lookAt(
            adoukusModel.position.x,
            adoukusModel.position.y + 1,
            adoukusModel.position.z
          );
        }

        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
